<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Glass Tile Preview</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 1; }
    button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
    #log { position: absolute; bottom: 10px; left: 10px; z-index: 1; font-size: 12px; color: #9f9; max-width: 60vw; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="export">Export .glb (static)</button>
    <button id="export-break">Export .glb (animated break)</button>
  </div>
  <div id="log"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./glassTileMain.js"></script>
</body>
</html>
