<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Human Voxel Preview</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; }
    button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
    button.active { outline: 2px solid #6cf; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #444; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #fff; }
    #log { position: absolute; bottom: 10px; left: 10px; z-index: 1; font-size: 12px; color: #9f9; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="row" id="presets"></div>
    <div class="row" id="shirts"></div>
    <button id="export">Export .glb</button>
  </div>
  <div id="log"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./humanMain.js"></script>
</body>
</html>
